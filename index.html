<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tudo Menos Vôlei</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }

        /* VÍDEO */

        .video-container {
            width: 100%;
            max-width: 1400px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            display: block;

            width: 100%;
            height: auto;

            max-width: 100vw;
            max-height: 100dvh;

            object-fit: contain;
        }

        /* TELA FINAL */

        .instagram-screen {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background: #000;

            padding: 30px;

            text-align: center;

            color: #fff;
        }

        .instagram-content {
            width: 100%;
            max-width: 420px;

            animation: aparecer 0.5s ease;
        }

        .instagram-content h1 {
            font-size: clamp(28px, 7vw, 48px);

            font-weight: 800;

            margin-bottom: 12px;
        }

        .instagram-content .arroba {
            font-size: clamp(20px, 5vw, 28px);

            font-weight: 600;

            margin-bottom: 20px;
        }

        .instagram-content p {
            font-size: 17px;

            line-height: 1.5;

            margin-bottom: 28px;

            color: #ddd;
        }

        .instagram-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 56px;

            padding: 0 28px;

            border-radius: 999px;

            background: #fff;

            color: #000;

            text-decoration: none;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition: transform 0.2s ease;
        }

        .instagram-button:hover {
            transform: scale(1.04);
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* BOTÃO DE ÁUDIO OPCIONAL */

        .sound-button {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 48px;
            height: 48px;

            border: none;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.6);

            color: #fff;

            font-size: 20px;

            cursor: pointer;
        }
        .sound-button {
    position: fixed;

    right: 20px;
    bottom: 20px;

    width: 52px;
    height: 52px;

    border: none;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.65);
    color: white;

    font-size: 22px;

    cursor: pointer;

    z-index: 10;

    backdrop-filter: blur(5px);

    transition: transform 0.2s ease;
}

.sound-button:hover {
    transform: scale(1.08);
}
    </style>
</head>

<body>

    <!-- VÍDEO -->

    <main class="video-container">

        <video
            id="video"
            autoplay
            muted
            playsinline
        >
            <source src="tmv.mp4" type="video/mp4">

            Seu navegador não suporta vídeos.
        </video>
        <button id="soundButton" class="sound-button">
            🔇
        </button>



    </main>


    <!-- TELA DO INSTAGRAM -->

    <section
        id="instagramScreen"
        class="instagram-screen"
    >

        <div class="instagram-content">

            <h1>Curtiu a bagunça? 👀</h1>

            <div class="arroba">
                @tudomenosvolei_
            </div>

            <p>
                Quer ver mais dessa história?
            </p>

            <a
                id="instagramButton"
                class="instagram-button"
                href="https://www.instagram.com/tudomenosvolei_/"
                target="_blank"
                rel="noopener noreferrer"
            >
                SIM, ABRIR INSTAGRAM →
            </a>

        </div>

    </section>


    <script>

        const video = document.getElementById("video");

        const instagramScreen =
            document.getElementById("instagramScreen");

        const instagramButton =
            document.getElementById("instagramButton");


        /*
         * QUANDO O VÍDEO TERMINAR
         */

        video.addEventListener("ended", () => {

            instagramScreen.style.display = "flex";

        });


        /*
         * TENTA ABRIR O APLICATIVO DO INSTAGRAM
         */

        instagramButton.addEventListener("click", function(event) {

            event.preventDefault();

            const instagramUsername = "tudomenosvolei_";

            const appURL =
                `instagram://user?username=${instagramUsername}`;

            const webURL =
                `https://www.instagram.com/${instagramUsername}/`;

            /*
             * Tenta abrir o aplicativo.
             */

            window.location.href = appURL;


            /*
             * Se o aplicativo não abrir,
             * volta para o Instagram pelo navegador.
             */

            setTimeout(() => {

                window.location.href = webURL;

            }, 1200);

        });
        const soundButton = document.getElementById("soundButton");

video.volume = 0.8;

soundButton.addEventListener("click", () => {

    video.muted = false;

    video.volume = 0.8;

    soundButton.textContent = "🔊";

});

    </script>

</body>

</html>
